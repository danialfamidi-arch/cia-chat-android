/* RUNNING TEXT PRO — animation settings are embedded in each message */
.ticker-box{width:100%;max-width:100%;min-height:54px;overflow:hidden;position:relative;display:flex;align-items:center;margin:8px 0;padding:9px 0;border-radius:13px;border:1px solid #354a68;background:linear-gradient(100deg,#101d2c,#111629 48%,#221637);box-shadow:inset 0 0 14px #6deaff12,0 5px 18px #0003}
.ticker-track{display:inline-flex;align-items:center;white-space:nowrap;width:max-content;max-width:none;flex:0 0 auto;animation-duration:var(--ticker-duration,4s);animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
.ticker-text{display:inline-block;white-space:nowrap;padding:0 24px;font-size:var(--ticker-size,24px);line-height:1.2;color:var(--ticker-color,#50eaff);font-family:var(--ticker-font,monospace);font-weight:900;letter-spacing:var(--ticker-spacing,2px);text-shadow:0 0 5px currentColor,0 0 12px currentColor,0 0 22px currentColor}
.ticker-box.motion-left .ticker-track{animation-name:ticker-go-left}
.ticker-box.motion-right .ticker-track{animation-name:ticker-go-right}
.ticker-box.motion-bounce .ticker-track{animation-name:ticker-bounce;animation-timing-function:ease-in-out;animation-direction:alternate}
.ticker-box.motion-shake .ticker-track{animation-name:ticker-shake;animation-duration:var(--ticker-shake-duration,.36s);animation-timing-function:ease-in-out}
@keyframes ticker-go-left{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@keyframes ticker-go-right{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
@keyframes ticker-bounce{from{transform:translateX(0)}to{transform:translateX(calc(100vw - 100%))}}
@keyframes ticker-shake{0%,100%{transform:translateX(-8px)}25%{transform:translateX(8px)}50%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
