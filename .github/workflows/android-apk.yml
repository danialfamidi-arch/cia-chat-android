      - name: Generate Android
        working-directory: native-source
        run: npx cap add android

      - name: Set CIA CHAT logo as Android app icon (verified manifest + adaptive icon)
        working-directory: native-source
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PYTHON'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          res = Path('android/app/src/main/res')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          logo_path = Path('www/cia-chat-logo.jpg')
          if not logo_path.is_file():
              raise SystemExit('Logo CIA CHAT tidak ditemukan: www/cia-chat-logo.jpg')
          if not manifest.is_file():
              raise SystemExit('AndroidManifest.xml tidak ditemukan; ikon tidak dapat dipastikan.')

          # Logo resmi CIA CHAT: kipas di dalam balon chat, hitam-putih.
          logo = Image.open(logo_path).convert('RGB')
          square = Image.new('RGB', (1024, 1024), 'white')
          fitted = ImageOps.contain(logo, (900, 900), method=Image.Resampling.LANCZOS)
          square.paste(fitted, ((1024 - fitted.width) // 2, (1024 - fitted.height) // 2))

          # Legacy launcher bitmap resources for common Android densities.
          density_sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in density_sizes.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = square.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', optimize=True)

          # Adaptive foreground is stored in drawable-nodpi; keep the full logo in the safe zone.
          fg = Image.new('RGBA', (432, 432), (255, 255, 255, 0))
          mark = ImageOps.contain(square, (260, 260), method=Image.Resampling.LANCZOS).convert('RGBA')
          fg.alpha_composite(mark, ((432 - mark.width) // 2, (432 - mark.height) // 2))
          drawable = res / 'drawable-nodpi'
          drawable.mkdir(parents=True, exist_ok=True)
          fg.save(drawable / 'ic_launcher_foreground.png', optimize=True)

          adaptive = res / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (adaptive / 'ic_launcher.xml').write_text(adaptive_xml, encoding='utf-8')
          (adaptive / 'ic_launcher_round.xml').write_text(adaptive_xml, encoding='utf-8')

          # Explicitly point Android at the CIA CHAT launcher resources.
          text = manifest.read_text(encoding='utf-8')
          app_match = re.search(r'<application\b[^>]*>', text, flags=re.DOTALL)
          if not app_match:
              raise SystemExit('Tag <application> tidak ditemukan pada AndroidManifest.xml')
          app_tag = app_match.group(0)
          def set_attr(tag, name, value):
              pattern = rf'\sandroid:{name}="[^"]*"'
              replacement = f' android:{name}="{value}"'
              if re.search(pattern, tag):
                  return re.sub(pattern, replacement, tag, count=1)
              return tag[:-1] + replacement + '>'
          app_tag = set_attr(app_tag, 'icon', '@mipmap/ic_launcher')
          app_tag = set_attr(app_tag, 'roundIcon', '@mipmap/ic_launcher_round')
          text = text[:app_match.start()] + app_tag + text[app_match.end():]
          manifest.write_text(text, encoding='utf-8')

          # Fail the build if the manifest does not reference the branded assets.
          check = manifest.read_text(encoding='utf-8')
          assert 'android:icon="@mipmap/ic_launcher"' in check
          assert 'android:roundIcon="@mipmap/ic_launcher_round"' in check
          assert (drawable / 'ic_launcher_foreground.png').is_file()
          assert (adaptive / 'ic_launcher.xml').is_file()
          print('CIA CHAT launcher logo installed and AndroidManifest icon references verified.')
          PYTHON

