name: Build CIA CHAT Android APK V1.7 Story Thumbnail Autoplay - FCM Preserved
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ZIP source
        run: |
          set -euo pipefail
          cat cia-chat-native-part-00 cia-chat-native-part-01 > source.zip
          unzip -tq source.zip
          mkdir native-source
          unzip -q source.zip -d native-source
          test -f native-source/package.json
          test -f native-source/google-services.json
          test -f native-source/www/index.html

      - name: Install latest CIA CHAT Story HTML V178
        run: |
          set -euo pipefail
          test -s index.html || { echo 'index.html V178 harus diunggah ke root repository.'; exit 1; }
          grep -q 'CIA_CHAT_BUILD="V178-STORY-REAL-THUMBNAIL-AUTOPLAY"' index.html
          install -m 0644 index.html native-source/www/index.html
          cmp -s index.html native-source/www/index.html
          test -s native-source/www/cia-chat-logo.jpg
          echo 'V178 HTML copied and verified for the Android APK.'

      - name: Verify native notification tap routing (preserve V1.5 behavior)
        working-directory: native-source
        run: |
          set -euo pipefail
          HTML='www/index.html'
          grep -q 'pushNotificationActionPerformed' "$HTML"
          grep -q 'incoming_call' "$HTML"
          grep -q 'story_comment_id' "$HTML"
          grep -q 'group_message_id' "$HTML"
          grep -q 'open_chat' "$HTML"
          grep -q 'url.origin!==location.origin' "$HTML"
          echo 'Existing native FCM notification tap routes verified; no FCM source rewritten.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: native-source
        run: npm install

      - name: Add native BBM-style FCM MessagingService
