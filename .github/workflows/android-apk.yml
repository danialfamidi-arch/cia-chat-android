      - name: Add native Heads-Up and Android Back handling
        working-directory: native-source
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('android/app/src/main/java/com/cia/chat')
          root.mkdir(parents=True, exist_ok=True)
          plugin = 'package com.cia.chat;\n\nimport android.content.Intent;\nimport android.os.Build;\nimport android.provider.Settings;\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport com.getcapacitor.JSObject;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginCall;\nimport com.getcapacitor.PluginMethod;\nimport com.getcapacitor.annotation.CapacitorPlugin;\nimport androidx.activity.OnBackPressedCallback;\n\n@CapacitorPlugin(name = "NotificationSettings")\npublic class NotificationSettingsPlugin extends Plugin {\n    @Override public void load() {\n        super.load();\n        getActivity().getOnBackPressedDispatcher().addCallback(getActivity(), new OnBackPressedCallback(true) {\n            @Override public void handleOnBackPressed() {\n                boolean canGoBack = getBridge() != null && getBridge().getWebView() != null && getBridge().getWebView().canGoBack();\n                if (!hasListeners("backButton")) {\n                    if (canGoBack) getBridge().getWebView().goBack(); else getActivity().finish();\n                    return;\n                }\n                JSObject event = new JSObject();\n                event.put("canGoBack", canGoBack);\n                notifyListeners("backButton", event, true);\n            }\n        });\n    }\n\n    @PluginMethod public void openChannelSettings(PluginCall call) {\n        String channelId = call.getString("channelId", "cia_messages");\n        try {\n            Intent intent;\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n                NotificationManager manager = (NotificationManager) getContext().getSystemService(android.content.Context.NOTIFICATION_SERVICE);\n                NotificationChannel channel = manager == null ? null : manager.getNotificationChannel(channelId);\n                if (channel == null) throw new IllegalStateException("Kanal notifikasi belum tersedia: " + channelId);\n                intent = new Intent(Settings.ACTION_CHANNEL_NOTIFICATION_SETTINGS);\n                intent.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());\n                intent.putExtra(Settings.EXTRA_CHANNEL_ID, channelId);\n            } else {\n                intent = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);\n                intent.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());\n            }\n            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n            getContext().startActivity(intent);\n            JSObject result = new JSObject();\n            result.put("opened", true);\n            result.put("channelId", channelId);\n            call.resolve(result);\n        } catch (Exception e) { call.reject("Tidak dapat membuka pengaturan kanal notifikasi Android", e); }\n    }\n\n    @PluginMethod public void openAppSettings(PluginCall call) {\n        try {\n            Intent intent = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);\n            intent.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());\n            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n            getContext().startActivity(intent);\n            call.resolve();\n        } catch (Exception e) { call.reject("Tidak dapat membuka pengaturan notifikasi Android", e); }\n    }\n\n    @PluginMethod public void exitApp(PluginCall call) { call.resolve(); getActivity().finish(); }\n}\n'
          main_activity = 'package com.cia.chat;\n\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport android.content.Context;\nimport android.os.Build;\nimport android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(NotificationSettingsPlugin.class);\n        super.onCreate(savedInstanceState);\n        createCiaNotificationChannels();\n    }\n    private void createCiaNotificationChannels() {\n        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;\n        NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n        if (manager == null) return;\n        NotificationChannel messages = new NotificationChannel("cia_messages", "Pesan CIA CHAT", NotificationManager.IMPORTANCE_HIGH);\n        messages.setDescription("Notifikasi pesan pribadi, grup, komentar, dan aktivitas CIA CHAT.");\n        messages.enableVibration(true);\n        messages.setVibrationPattern(new long[] {0, 220, 120, 220});\n        manager.createNotificationChannel(messages);\n        NotificationChannel calls = new NotificationChannel("cia_calls", "Panggilan CIA CHAT", NotificationManager.IMPORTANCE_HIGH);\n        calls.setDescription("Notifikasi panggilan suara dan video CIA CHAT.");\n        calls.enableVibration(true);\n        calls.setVibrationPattern(new long[] {0, 350, 180, 350, 180, 350});\n        manager.createNotificationChannel(calls);\n    }\n}\n'
          (root / 'NotificationSettingsPlugin.java').write_text(plugin, encoding='utf-8')
          (root / 'MainActivity.java').write_text(main_activity, encoding='utf-8')
          print('Native Java sources written without base64 encoding.')
          PYTHON

      - name: Configure Firebase
        working-directory: native-source
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('android/build.gradle')
          s = p.read_text()
          marker = "classpath 'com.google.gms:google-services:4.4.2'"
          if marker not in s:
              s = s.replace('dependencies {', 'dependencies {\n        ' + marker, 1)
          p.write_text(s)
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'com.google.gms.google-services' not in s:
              p.write_text(s + "\napply plugin: 'com.google.gms.google-services'\n")
          PYTHON

      - name: Sync Capacitor
        working-directory: native-source
        run: npx cap sync android

      - name: Apply CIA CHAT launcher logo AFTER Capacitor sync (no Python packages)
        working-directory: native-source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          LOGO="www/cia-chat-logo.jpg"
          test -s "$LOGO"
          RES="android/app/src/main/res"
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi" "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26"

          # Standard launcher icons: use the supplied CIA CHAT logo on white.
          convert "$LOGO" -auto-orient -strip -resize '900x900>' -background white -gravity center -extent 1024x1024 /tmp/cia-chat-square.png
          for spec in 'mdpi 48' 'hdpi 72' 'xhdpi 96' 'xxhdpi 144' 'xxxhdpi 192'; do
            set -- $spec
            density="$1"
            size="$2"
            convert /tmp/cia-chat-square.png -filter Lanczos -resize "${size}x${size}" "$RES/mipmap-${density}/ic_launcher.png"
            cp "$RES/mipmap-${density}/ic_launcher.png" "$RES/mipmap-${density}/ic_launcher_round.png"
            cp "$RES/mipmap-${density}/ic_launcher.png" "$RES/mipmap-${density}/ic_launcher_foreground.png"
          done

          # Adaptive foreground uses a unique resource name to avoid Capacitor's vector.
          convert "$LOGO" -auto-orient -strip -resize '286x286>' -background none -gravity center -extent 432x432 "$RES/drawable-nodpi/cia_chat_launcher_foreground.png"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/white" />
            <foreground android:drawable="@drawable/cia_chat_launcher_foreground" />
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          test -s "$RES/drawable-nodpi/cia_chat_launcher_foreground.png"
          grep -q 'cia_chat_launcher_foreground' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q 'cia_chat_launcher_foreground' "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo 'CIA CHAT launcher icons generated from www/cia-chat-logo.jpg.'

      - name: Build APK
        working-directory: native-source/android
        run: ./gradlew assembleDebug

      - name: Verify APK output (non-blocking icon diagnostics)
        run: |
          set -euo pipefail
          APK="native-source/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK file exists and is not empty."
          ls -lh "$APK"
          sha256sum "$APK"

          # Print launcher metadata for diagnosis, but do not fail a valid APK
          # because Android build-tools format resource names differently.
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1 || true)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -E "^(package:|application:|launchable-activity:)" || true
            "$AAPT" dump resources "$APK" | grep -E "cia_chat_launcher_foreground|ic_launcher(_round)?" | head -40 || true
          else
            echo "aapt not found; APK existence check completed."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIA-CHAT-Android-APK-V1.7-STORY-THUMBNAIL-AUTOPLAY
          path: native-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
