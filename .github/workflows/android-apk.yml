      - name: Generate Android
        working-directory: native-source
        run: npx cap add android

      - name: Set CIA CHAT logo as Android app icon
        working-directory: native-source
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PYTHON'
          from pathlib import Path
          from PIL import Image, ImageOps
          root = Path('android/app/src/main/res')
          source = Image.open('www/cia-chat-logo.jpg').convert('RGB')
          source = ImageOps.fit(source, (1024, 1024), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in sizes.items():
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder/'ic_launcher.png', optimize=True)
              icon.save(folder/'ic_launcher_round.png', optimize=True)
          fg = Image.new('RGB', (432, 432), 'white')
          mark = ImageOps.contain(source, (340, 340), method=Image.Resampling.LANCZOS)
          fg.paste(mark, ((432-mark.width)//2, (432-mark.height)//2))
          ad = root/'mipmap-anydpi-v26'
          ad.mkdir(parents=True, exist_ok=True)
          fg.save(ad/'ic_launcher_foreground.png', optimize=True)
          (ad/'ic_launcher.xml').write_text("<adaptive-icon xmlns:android='http://schemas.android.com/apk/res/android'>\n    <background android:drawable='@android:color/white' />\n    <foreground android:drawable='@mipmap/ic_launcher_foreground' />\n</adaptive-icon>\n")
          (ad/'ic_launcher_round.xml').write_text("<adaptive-icon xmlns:android='http://schemas.android.com/apk/res/android'>\n    <background android:drawable='@android:color/white' />\n    <foreground android:drawable='@mipmap/ic_launcher_foreground' />\n</adaptive-icon>\n")
          PYTHON

