name: Build CIA CHAT Android APK V1.5 BBM Native
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ZIP source
        run: |
          cat cia-chat-native-part-00 cia-chat-native-part-01 > source.zip
          unzip -tq source.zip
          mkdir native-source
          unzip -q source.zip -d native-source
          test -f native-source/package.json
          test -f native-source/google-services.json
          test -f native-source/www/index.html

      - name: Patch notification tap routing V1.5
        working-directory: native-source
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          old_variants = [
              base64.b64decode('').decode(),
              base64.b64decode('').decode(),
          ]
          new = base64.b64decode('').decode()
          if new in s:
              print('V1.5 notification routing already present')
          else:
              for old in old_variants:
                  if old in s:
                      s = s.replace(old, new, 1)
                      break
              else:
                  raise SystemExit('Versi sumber tidak dikenali. Build dihentikan; file sumber tidak diubah.')
              p.write_text(s, encoding='utf-8')
              print('V1.5 notification routing patched successfully')
          PYTHON

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: native-source
        run: npm install

